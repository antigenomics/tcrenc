---
general:
  LINEAR_PART_CDR3: 19
  LINEAR_PART_EPITOPE: 20
  BATCH_SIZE: 64
  LOSS_FUNCTION:
    _component_: torch.nn.MSELoss
train:
  EPOCH_NUM: 100
  LEARNING_RATE: 1e-3
validate:
  blank: 'blank'
run:
  WEIGHTS_CDR3: './tcrenc/models/autoencoder_kidera/weights/cdr3_restructed.pth'
  # weights on server path projects/tcr_nlp/conv_autoencoder/conv/cdr3.pth. Should be update. See examples/Weights_update.ipynb
  WEIGHTS_EPIOPE: './tcrenc/models/autoencoder_kidera/weights/epitope_restructed.pth'
  # weights on server path projects/tcr_nlp/conv_autoencoder/conv/epitope.pth Should be update. See examples/Weights_update.ipynb